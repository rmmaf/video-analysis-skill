[pytest]
# Run from the skill folder with:  python -B -m pytest -q
# (-B and -p no:cacheprovider keep __pycache__ and .pytest_cache out of the skill folder)
testpaths = tests
addopts = -p no:cacheprovider
markers =
    real: needs the real videos/VTTs listed in tests/fixtures.json (run with --run-real or VA_RUN_REAL=1)
    slow: long performance tests (run with --run-slow or VA_RUN_SLOW=1)
